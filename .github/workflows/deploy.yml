name: Deploy to Shared Hosting

on:
  push:
    branches:
      - master # Change this to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 14 # Use the version of Node.js your project requires

      - name: Install project dependencies
        run: npm install
        working-directory: ./

      - name: Build React project
        run: npm run build
        working-directory: ./

      - name: Deploy to Shared Hosting
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          ssh-keyscan -t rsa,ecdsa,ed25519 212.1.210.146 >> $HOME/.ssh/known_hosts
          scp -i <(echo "$SSH_PRIVATE_KEY") -r your-react-app-folder/build/* bilawale@212.1.210.146:/home/bilawale/shippinghack.zeeshannawaz.com

      - name: Clean up
        run: |
          # Clean up any temporary files or do post-deployment cleanup
